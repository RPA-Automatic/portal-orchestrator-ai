name: Publicar produção na Netlify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          : "${NETLIFY_AUTH_TOKEN:?Configure o secret NETLIFY_AUTH_TOKEN no GitHub Actions}"
          : "${NETLIFY_SITE_ID:?Configure o secret NETLIFY_SITE_ID no GitHub Actions}"
          npx --yes --package=netlify-cli@27.10.0 netlify deploy --prod --dir=dist --no-build
